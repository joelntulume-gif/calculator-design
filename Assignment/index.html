<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MODERN WEB CALCULATOR</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator">
     <div class="display"></div>
     <div class="one">
        <button id="AC"> AC</button>
        <button>00</button>
        <button>%</button>
        <button id="symbols">&divide;</button>
     
     
        <BUTTON>7</BUTTON>
        <BUTTON>8</BUTTON>
        <BUTTON>9</BUTTON>
        <BUTTON id="symbols">&times;</BUTTON>
    
     
        <button>4</button>
        <button>5</button>
        <button>6</button>
        <button id="symbols">-</button>
     
    
        <button>1</button>
        <button>2</button>
        <button>3</button>
        <button id="symbols">+</button>
     
     
        <button class="zero">0</button>
        <button>.</button>
        <button id="symbols">=</button></div>
    </div>
</body>
</html>
